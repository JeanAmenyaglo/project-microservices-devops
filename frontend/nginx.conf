server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for Docker and Kubernetes probes
    location /health {
        return 200 '{"status":"healthy","service":"frontend"}';
        add_header Content-Type application/json;
    }

    # Proxy /api/users → user-service container
    location /api/users {
        proxy_pass http://user-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /api/products → product-service container
    location /api/products {
        proxy_pass http://product-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router — serve index.html for all routes
    # Without this, refreshing on /products gives a 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}