name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test user-service
        run: |
          cd user-service
          npm ci
          npm test --if-present

      - name: Test product-service
        run: |
          cd product-service
          npm ci
          npm test --if-present

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push user-service
        run: |
          docker build -t ${{ secrets.ECR_USER_SERVICE }}:${{ steps.tag.outputs.tag }} ./user-service
          docker push ${{ secrets.ECR_USER_SERVICE }}:${{ steps.tag.outputs.tag }}

      - name: Build and push product-service
        run: |
          docker build -t ${{ secrets.ECR_PRODUCT_SERVICE }}:${{ steps.tag.outputs.tag }} ./product-service
          docker push ${{ secrets.ECR_PRODUCT_SERVICE }}:${{ steps.tag.outputs.tag }}

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg VITE_USER_SERVICE_URL=http://user-service:3001 \
            --build-arg VITE_PRODUCT_SERVICE_URL=http://product-service:3002 \
            -t ${{ secrets.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }} \
            ./frontend
          docker push ${{ secrets.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }}

      - name: Scan user-service image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ECR_USER_SERVICE }}:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Scan product-service image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ECR_PRODUCT_SERVICE }}:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Update image tags in manifests
        run: |
          sed -i "s|microservices-app-user-service:latest|microservices-app-user-service:${{ needs.build-and-push.outputs.image-tag }}|g" k8s/deployment.yaml
          sed -i "s|microservices-app-product-service:latest|microservices-app-product-service:${{ needs.build-and-push.outputs.image-tag }}|g" k8s/deployment.yaml
          sed -i "s|microservices-app-frontend:latest|microservices-app-frontend:${{ needs.build-and-push.outputs.image-tag }}|g" k8s/deployment.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic app-secrets \
            --from-literal=DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --namespace=production \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/user-service -n production --timeout=300s
          kubectl rollout status deployment/product-service -n production --timeout=300s
          kubectl rollout status deployment/frontend -n production --timeout=300s