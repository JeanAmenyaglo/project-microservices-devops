
services:

  # ── User Service Database ──────────────────
  users-db:
    image: postgres:16-alpine
    container_name: users-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Product Service Database ───────────────
  products-db:
    image: postgres:16-alpine
    container_name: products-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - products-db-data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── User Service ───────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
      target: production
    container_name: user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: users-db
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      users-db:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Product Service ────────────────────────
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
      target: production
    container_name: product-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: products-db
      DB_PORT: 5432
      DB_NAME: products_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      USER_SERVICE_URL: http://user-service:3001
    depends_on:
      products-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_USER_SERVICE_URL: http://localhost:3001
        VITE_PRODUCT_SERVICE_URL: http://localhost:3002
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - app-net

# ── Network ────────────────────────────────
# All containers communicate by service name
# product-service calls http://user-service:3001
# frontend calls http://user-service:3001 and http://product-service:3002
networks:
  app-net:
    driver: bridge

# ── Volumes ────────────────────────────────
# One volume per database — database-per-service pattern
# Data persists even when containers are stopped
volumes:
  users-db-data:
  products-db-data: