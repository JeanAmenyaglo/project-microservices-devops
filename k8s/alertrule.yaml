apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: microservices-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: microservices
      rules:
        - alert: ServiceHighErrorRate
          expr: |
            rate(http_requests_total{status_code=~"5.."}[5m]) > 0.1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on {{ $labels.service }}"
            description: "{{ $labels.service }} has error rate above 10%"

        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="production"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting"

        - alert: HighMemoryUsage
          expr: |
            container_memory_usage_bytes{namespace="production"} / container_spec_memory_limit_bytes{namespace="production"} > 0.8
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage in {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} memory usage is above 80%"